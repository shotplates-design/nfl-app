# Pull current NFL injuries from ESPN's public site API into
# data/week-N-conditions.json as a baseline only (never overwrite Kenzie
# injury rows or weather/with_without/inactives/kickoff). Fail closed:
# no commit on fetch/parse/empty. Vercel deploys from the push. No odds.
name: refresh-injuries
on:
  schedule:
    # Injury-report windows in UTC (approx ET):
    # 12:00 UTC ≈ 7/8 AM ET, 21:00 UTC ≈ 4/5 PM ET, Wed–Sun.
    - cron: "0 12 * * 0,3,4,5,6"
    - cron: "0 21 * * 0,3,4,5,6"
    # Sunday inactives window ≈ 10:30 AM ET.
    - cron: "30 15 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-nfl-injuries
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Refresh injuries from ESPN (fail closed)
        run: python scripts/refresh_injuries.py --data-dir data
      - name: Import Kenzie feed when mounted (no-op on GitHub)
        run: |
          if [ -d /workspace/feeds ] && ls /workspace/feeds/week-*-conditions.json >/dev/null 2>&1; then
            python scripts/import_kenzie_feed.py --feeds-dir /workspace/feeds --data-dir data
          else
            echo "Kenzie feed not present on this runner; ESPN-only refresh stands."
          fi
      - name: Unit tests for injury refresh
        run: python -m unittest scripts.tests.test_refresh_injuries -v
      - name: Pack conditions file for the commit job
        run: |
          set -euo pipefail
          week=$(python - <<'PY'
          import re
          from pathlib import Path
          weeks = []
          for path in Path("data").glob("week-*-conditions.json"):
              match = re.search(r"week-(\d+)-conditions", path.name)
              if match:
                  weeks.append(int(match.group(1)))
          if not weeks:
              raise SystemExit("no conditions files")
          print(max(weeks))
          PY
          )
          mkdir -p refresh-out
          cp "data/week-${week}-conditions.json" "refresh-out/week-${week}-conditions.json"
          echo "$week" > refresh-out/week.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-injuries
          retention-days: 1
          path: refresh-out

  commit:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nfl-injuries
          path: candidate
      - name: Replace conditions file and commit when changed
        run: |
          set -euo pipefail
          if [ -f candidate/week.txt ]; then src=candidate
          elif [ -f candidate/refresh-out/week.txt ]; then src=candidate/refresh-out
          else echo "Unexpected artifact layout" && find candidate -maxdepth 3 -type f && exit 1
          fi
          week=$(cat "$src/week.txt")
          mkdir -p data
          cp "$src/week-${week}-conditions.json" "data/week-${week}-conditions.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/week-${week}-conditions.json"
          if git diff --cached --quiet; then
            echo "No injury data changes."
            exit 0
          fi
          git commit -m "Refresh week ${week} injuries from ESPN"
          git push origin HEAD:main
